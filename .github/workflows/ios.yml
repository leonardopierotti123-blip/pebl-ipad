name: iPad build

# Builds PEBL for iPad on a GitHub-hosted Mac and publishes an unsigned .ipa
# as a workflow artifact.  Sign/install it with Sideloadly or AltStore
# (works from Windows) or with Xcode; see ios/README.md.

on:
  push:
    paths:
      - "src/**"
      - "pebl-lib/**"
      - "battery/**"
      - "media/**"
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

jobs:
  ipad:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Configure (CMake -> Xcode project)
        run: |
          cmake -S ios -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPEBL_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (device, unsigned)
        run: |
          set +e
          cmake --build build-ios --config Release -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" build.log | head -200
          exit $status

      - name: Package .ipa
        run: |
          APP=$(find build-ios -path "*Release-iphoneos/PEBL.app" -maxdepth 4 -type d | head -1)
          echo "App bundle: $APP"
          test -n "$APP"
          test -f "$APP/ios-launcher.pbl"
          test -d "$APP/battery" && test -d "$APP/pebl-lib" && test -d "$APP/media"
          du -sh "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry "PEBL-iPad-unsigned-${{ github.run_number }}.ipa" Payload)
          ls -lh dist/*.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PEBL-iPad-unsigned
          path: dist/*.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
